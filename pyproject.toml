[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kaula"
version = "0.1.0"
description = "Local-first prompt↔code provenance: which prompt produced this line?"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kaula Systems" }]
keywords = ["provenance", "claude-code", "cursor", "git", "attribution", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kaulasystems/kaula-trace-"
Source = "https://github.com/kaulasystems/kaula-trace-"

[project.scripts]
kaula = "kaula.cli:main"

[tool.setuptools]
packages = ["kaula"]
